<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#050203}
.wrap{width:1200px;height:630px;position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
.glow{position:absolute;top:50%;left:40%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(201,169,110,.08) 0%,transparent 70%);pointer-events:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,169,110,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,110,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C9A96E;margin-bottom:24px}
h1{font-family:'Cormorant Garamond',serif;font-size:108px;font-weight:300;color:#F5F5F5;line-height:.9;letter-spacing:-.01em;margin-bottom:20px}
.tagline{font-family:'Cormorant Garamond',serif;font-size:28px;color:#888;font-weight:300;font-style:italic;margin-bottom:40px}
.metrics{display:flex;gap:56px}
.m-val{font-family:'JetBrains Mono',monospace;font-size:28px;color:#C9A96E;display:block;margin-bottom:4px}
.m-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#3A3A3A}
.url{position:absolute;bottom:40px;right:96px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#2A2A2A}
.line{position:absolute;top:0;left:96px;right:96px;height:1px;background:linear-gradient(90deg,transparent,#C9A96E44,transparent)}
.line-b{position:absolute;bottom:0;left:96px;right:96px;height:1px;background:linear-gradient(90deg,transparent,#C9A96E44,transparent)}
</style></head><body>
<div class="wrap">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="line"></div>
  <div class="line-b"></div>
  <div class="label">Oracle Critical Engineering · México</div>
  <h1>FABRIC</h1>
  <div class="tagline">Rescata, estabiliza y blinda proyectos Oracle</div>
  <div class="metrics">
    <div><span class="m-val">90d</span><span class="m-label">Estabilización</span></div>
    <div><span class="m-val">0</span><span class="m-label">Juniors facturables</span></div>
    <div><span class="m-val">100%</span><span class="m-label">Responsabilidad</span></div>
  </div>
  <div class="url">equipo-a-v2.vercel.app</div>
</div>
</body></html>
